    title: Levantamento do sistema atual
    priority: P0
    kind: docs
    executor: agent
    goal: "Mapear módulos, dados e integrações do sistema atual."
    steps: ["Ler o código e a documentação"]
    acceptance: ["Documento de levantamento publicado"]
  - id: D-002
    title: Plano de migração aprovado
    priority: P0
    kind: docs
    executor: any
    goal: "Definir a ordem de migração dos módulos e o plano de retorno."
    acceptance: ["Plano revisado pela equipe"]
    depends_on: [D-001]
  - id: D-003
    title: Migrar o módulo de catálogo
    priority: P1
    kind: dev
    executor: agent
    goal: "Levar o catálogo de produtos para a nova plataforma sem perder histórico."
    acceptance: ["Produtos migrados e conferidos"]
    depends_on: [D-002]
    gates: [tests]
  - id: D-004
    title: Migrar o módulo de pedidos
    priority: P1
    kind: dev
    executor: agent
    goal: "Migrar pedidos e status de entrega."
    acceptance: ["Pedidos migrados e conferidos"]
    depends_on: [D-003]
    gates: [tests]
