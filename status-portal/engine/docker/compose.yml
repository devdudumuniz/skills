# Painel de status em container (modo dev, sempre ativo).
#   docker compose -f status/engine/docker/compose.yml up -d --build     (1ª vez ou ao mudar dependências)
#   docker compose -f status/engine/docker/compose.yml logs -f status-portal
#   docker compose -f status/engine/docker/compose.yml down              (nada do projeto é apagado)
#
# Variáveis (arquivo .env ao lado ou ambiente):
#   STATUS_PORT   porta publicada no host (padrão 8780; 8765-8767 são do portal do escritório)
#   STATUS_BIND   IP de publicação (padrão 127.0.0.1). Para proxy reverso na LAN use o IP da interface (nunca 0.0.0.0).
#   STATUS_PROXY_TOKEN  segredo opcional: o proxy envia "X-Portal-Proxy-Token: <valor>"; sem ele (fora de loopback) = 403.
# Só a visão do CLIENTE (CLIENT_VIEWER), somente leitura. Ver references/PUBLISHING.md.
name: ${STATUS_COMPOSE_NAME:-status-portal}

services:
  status-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: status-portal/dev:1
    container_name: ${STATUS_COMPOSE_NAME:-status-portal}
    restart: unless-stopped
    command: ["python", "status/engine/docker/dev_reload.py", "--watch", "status/engine/statuskit", "--",
              "python", "status/status.py", "serve", "--host", "0.0.0.0", "--port", "8766", "--role", "client-viewer"]
    environment:
      STATUS_CONTAINER: "1"
      STATUS_ROLE: client-viewer
      STATUS_PROXY_TOKEN: ${STATUS_PROXY_TOKEN:-}
    ports:
      - "${STATUS_BIND:-127.0.0.1}:${STATUS_PORT:-8780}:8766"
    volumes:
      - ../../..:/project:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
