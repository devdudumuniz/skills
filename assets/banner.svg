<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <radialGradient id="cyanGlow" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#cyanGlow)"/>
  <rect width="1200" height="360" fill="url(#indigoGlow)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="12" y="12" width="1176" height="336" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Tech Dots / Matrix Accents -->
  <g fill="#38bdf8" opacity="0.3">
    <circle cx="50" cy="50" r="2"/>
    <circle cx="70" cy="50" r="2"/>
    <circle cx="90" cy="50" r="2"/>
    <circle cx="50" cy="70" r="2"/>
    <circle cx="70" cy="70" r="2"/>
    <circle cx="1130" cy="50" r="2"/>
    <circle cx="1150" cy="50" r="2"/>
    <circle cx="1130" cy="70" r="2"/>
    <circle cx="1150" cy="70" r="2"/>
    <circle cx="1150" cy="90" r="2"/>
  </g>

  <!-- Central Icon Badge -->
  <g transform="translate(100, 80)">
    <!-- Outer Hex / Shield Core -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="4" y="4" width="92" height="92" rx="18" fill="#090d16" stroke="url(#shieldGrad)" stroke-width="2.5"/>
    
    <!-- Geometric Neural Nodes -->
    <circle cx="50" cy="28" r="7" fill="#38bdf8"/>
    <circle cx="28" cy="68" r="7" fill="#818cf8"/>
    <circle cx="72" cy="68" r="7" fill="#c084fc"/>
    
    <line x1="50" y1="28" x2="28" y2="68" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="28" x2="72" y2="68" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="68" x2="72" y2="68" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="50" cy="52" r="5" fill="#f8fafc"/>
  </g>

  <!-- Header & Typography -->
  <g transform="translate(230, 115)">
    <!-- Category Pill -->
    <rect x="0" y="-36" width="220" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
    <text x="110" y="-19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      UNIVERSAL AGENT SUITE
    </text>

    <!-- Main Title -->
    <text x="0" y="32" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      DM SKILLS
    </text>
    
    <!-- Version Tag -->
    <rect x="250" y="-4" width="56" height="22" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="278" y="11" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">v2.0</text>

    <!-- Subtitle -->
    <text x="0" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" letter-spacing="0.2">
      Production-Grade AI Agent Skills Hub · Standardized for Multi-Agent Orchestration
    </text>
  </g>

  <!-- Agent Interoperability Badges -->
  <g transform="translate(100, 240)">
    <!-- Label -->
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      RUNTIME COMPATIBILITY:
    </text>

    <!-- Claude Code -->
    <g transform="translate(195, 2)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#181c2e" stroke="#3730a3" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#f97316"/>
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Claude Code</text>
    </g>

    <!-- OpenAI Codex -->
    <g transform="translate(337, 2)">
      <rect x="0" y="0" width="136" height="34" rx="8" fill="#181c2e" stroke="#047857" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#10b981"/>
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">OpenAI Codex</text>
    </g>

    <!-- Manus -->
    <g transform="translate(485, 2)">
      <rect x="0" y="0" width="98" height="34" rx="8" fill="#181c2e" stroke="#0369a1" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#0ea5e9"/>
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Manus</text>
    </g>

    <!-- Antigravity -->
    <g transform="translate(595, 2)">
      <rect x="0" y="0" width="125" height="34" rx="8" fill="#181c2e" stroke="#4338ca" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#6366f1"/>
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Antigravity</text>
    </g>

    <!-- Hermes -->
    <g transform="translate(732, 2)">
      <rect x="0" y="0" width="105" height="34" rx="8" fill="#181c2e" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#f59e0b"/>
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Hermes</text>
    </g>

    <!-- OpenCode -->
    <g transform="translate(849, 2)">
      <rect x="0" y="0" width="115" height="34" rx="8" fill="#181c2e" stroke="#0f766e" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#14b8a6"/>
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">OpenCode</text>
    </g>
  </g>

  <!-- Bottom Spec Highlights -->
  <g transform="translate(100, 310)">
    <text x="0" y="0" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
      ⚡ Plan-First &amp; Read-Only Defaults
    </text>
    <text x="260" y="0" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
      🛡️ Strict Anti-Exfiltration &amp; Zero Hardcoded Secrets
    </text>
    <text x="630" y="0" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
      📦 Deterministic .skill Packaging &amp; Fast CLI Installs
    </text>
  </g>
</svg>
